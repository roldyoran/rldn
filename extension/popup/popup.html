<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=350" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<!-- Main View -->
		<div id="view-main" class="view">
			<!-- Header -->
			<header class="header">
				<div class="header-left">
					<div class="logo">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
							<rect x="3" y="3" width="18" height="18" rx="2"></rect>
							<circle cx="8.5" cy="8.5" r="1.5"></circle>
							<polyline points="21 15 16 10 5 21"></polyline>
						</svg>
					</div>
					<span class="header-title">Canvas Grab</span>
				</div>
				<button id="btn-settings" class="icon-btn" title="Configuración">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="3"></circle>
						<path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
					</svg>
				</button>
			</header>

			<!-- Canvas Selector -->
			<div class="section">
				<label class="label">Lienzo</label>
				<div id="canvas-select-wrapper" class="select-wrapper">
					<select id="canvas-select" class="select">
						<option value="">Seleccionar lienzo...</option>
					</select>
					<div class="select-arrow">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
					</div>
				</div>
			</div>

			<!-- Capture Button -->
			<div class="section">
				<button id="btn-capture" class="btn-primary" disabled>
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
						<circle cx="12" cy="13" r="4"></circle>
					</svg>
					Capturar imagen
				</button>
			</div>

			<!-- Status -->
			<div id="status" class="status hidden"></div>

			<!-- Footer -->
			<footer class="footer">
				<a id="link-dashboard" href="#" class="footer-link">Abrir dashboard</a>
			</footer>
		</div>

		<!-- Settings View -->
		<div id="view-settings" class="view hidden">
			<!-- Header -->
			<header class="header">
				<div class="header-left">
					<button id="btn-back" class="icon-btn" title="Volver">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<polyline points="15 18 9 12 15 6"></polyline>
						</svg>
					</button>
					<span class="header-title">Configuración</span>
				</div>
			</header>

			<div class="section">
				<label class="label" for="input-api-key">API Key</label>
				<input
					id="input-api-key"
					type="password"
					class="input mono"
					placeholder="rldn_..."
					spellcheck="false"
					autocomplete="off"
				/>
				<p class="hint">Créala en tu dashboard → API Keys</p>
			</div>

			<div class="section">
				<label class="label" for="input-base-url">Backend URL</label>
				<input
					id="input-base-url"
					type="url"
					class="input mono"
					placeholder="http://localhost:4321"
					spellcheck="false"
				/>
			</div>

			<div class="section">
				<button id="btn-save-config" class="btn-primary">Guardar</button>
			</div>

			<div id="config-status" class="status hidden"></div>
		</div>

		<script src="../lib/api.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
